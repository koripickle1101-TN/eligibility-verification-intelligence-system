name: EVIS evidence and browser checks
on:
  pull_request:
    paths:
      - '**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright axe-core
          npx playwright install --with-deps chromium
      - name: Serve static EVIS files
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/evis-server.log 2>&1 &
          sleep 2
      - name: Verify CSV arithmetic and browser flows
        run: node tests/evis-smoke.cjs
      - name: Preserve browser screenshots and accessibility findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evis-browser-validation-evidence
          path: |
            /tmp/evis-*.png
            /tmp/evis-accessibility-report.json
            /tmp/evis-server.log
          if-no-files-found: warn
